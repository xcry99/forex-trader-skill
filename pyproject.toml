[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "forex-trader-skill"
version = "1.0.0"
description = "Autonomous Forex trading skills for Claude, backed by MetaTrader 5"
requires-python = ">=3.8"
dependencies = ["MetaTrader5>=5.0.45; sys_platform == 'win32'"]

[tool.setuptools]
packages = ["fx"]
